# Local development: a random JWT secret is generated (with a warning) when JWT_SECRET is not set.
app:
  jwt:
    allow-generated-secret: true

springdoc:
  api-docs:
    enabled: true
    path: /api/docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # send the XSRF-TOKEN cookie back as X-XSRF-TOKEN so "Try it out" works for POST/PUT/PATCH/DELETE
    csrf:
      enabled: true
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.splitmate: DEBUG
